<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguro Fiança</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style_login.css">
</head>
<body>
  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
    <div class="d-flex align-items-center gap-3">
      <div class="brand">
        <img src="images/allianz-logo.png" width="122" height="30" alt="Logo Allianz">
      </div>
      <div class="small text-muted">
        <div class="fw-semibold"></div>
        <div></div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-4">
      <div class="small text-end text-muted">
        <div class="fw-semibold">Versão 1.00</div>
        <div>Seguro Fiança</div>
      </div>
    </div>
  </div>

  <!-- Conteúdo Centralizado -->
  <div class="center-container">
    <div class="login-container">
      <h1 class="text-center">Login</h1>
        <!-- Campo Usuário -->
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuário</label>
          <input type="text" class="form-control" id="usuario" placeholder="Digite seu usuário">
        </div>
        <!-- Campo Senha -->
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
        </div>
        <!-- Botão Entrar -->
        <a href="home.html">
          <div class="d-grid">
            <button type="submit" class="btn btn-primary" id="btn-enviar">Entrar</button>
          </div>
        </a>
        <!-- Link Cadastre-se -->
        <div class="form-text mt-3 text-center">
          Não tem uma conta? <a href="cadastro_usuario.html">Cadastre-se</a>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
